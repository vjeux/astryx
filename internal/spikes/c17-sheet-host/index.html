<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sheet host spike</title>
    <style>
      :root {
        color-scheme: light;
        --sheet: #0a4bff;
        --dim-max: 0.35;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        timeline-scope: --sheet;
      }
      body {
        font:
          15px -apple-system,
          system-ui,
          sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #page {
        padding: 72px 16px 32px;
      }
      #page h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      #page .row {
        height: 52px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #d1d1d6;
      }
      #reopen {
        font: inherit;
        padding: 10px 16px;
        border-radius: 10px;
        border: 0;
        background: #1c1c1e;
        color: #fff;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        touch-action: none;
      }
      #dim.closed {
        pointer-events: none;
      }
      #dim.sd {
        animation-name: dimByScroll;
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --sheet;
      }
      @keyframes dimByScroll {
        from {
          opacity: 0;
        }
        to {
          opacity: var(--dim-max);
        }
      }
      #host {
        position: fixed;
        inset: 0;
      }
      #host.hybrid {
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        scroll-timeline: --sheet y;
      }
      #host.hybrid::-webkit-scrollbar {
        display: none;
      }
      #host.passthrough,
      #host.js {
        pointer-events: none;
      }
      #host.js {
        overflow: hidden;
      }
      #host.js #spacer {
        display: none;
      }
      #sheet {
        position: relative;
        pointer-events: auto;
        background: var(--sheet);
        color: #fff;
        border-radius: 12px 12px 0 0;
        /* Paints below the sheet when it rubber-bands up; not scroll overflow. */
        box-shadow: 0 600px 0 0 var(--sheet);
      }
      #host.js #sheet {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        touch-action: none;
        will-change: transform;
      }
      #grabber {
        position: absolute;
        top: 6px;
        left: 50%;
        width: 36px;
        height: 5px;
        margin-left: -18px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.85);
      }
      #sheet .content {
        padding: 28px 0 0 20px;
        width: 62%;
      }
      #sheet .item {
        height: 52px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      }
      .snap {
        position: absolute;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        scroll-snap-align: start;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 8px;
        max-width: 58vw;
        margin: 0;
        padding: 4px 6px;
        font:
          10px/1.3 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
      }
      #spin-c,
      #spin-j {
        position: fixed;
        top: 12px;
        width: 20px;
        height: 20px;
        border-radius: 3px;
        pointer-events: none;
        z-index: 10;
      }
      #spin-c {
        right: 8px;
        background: #19c37d;
        animation: spin 1s linear infinite;
      }
      #spin-j {
        right: 36px;
        background: #ff3b30;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <h1>Page behind the sheet</h1>
      <p><button id="reopen" type="button" hidden>Open sheet</button></p>
      <div class="row">Row 1</div>
      <div class="row">Row 2</div>
      <div class="row">Row 3</div>
      <div class="row">Row 4</div>
      <div class="row">Row 5</div>
      <div class="row">Row 6</div>
      <div class="row">Row 7</div>
      <div class="row">Row 8</div>
      <div class="row">Row 9</div>
      <div class="row">Row 10</div>
      <div class="row">Row 11</div>
      <div class="row">Row 12</div>
    </main>
    <div id="dim"></div>
    <div id="host">
      <div id="spacer"></div>
      <div id="sheet" role="dialog" aria-label="Spike sheet">
        <div id="grabber"></div>
        <div class="content">
          <div class="item">Item 1</div>
          <div class="item">Item 2</div>
          <div class="item">Item 3</div>
          <div class="item">Item 4</div>
          <div class="item">Item 5</div>
          <div class="item">Item 6</div>
          <div class="item">Item 7</div>
          <div class="item">Item 8</div>
          <div class="item">Item 9</div>
          <div class="item">Item 10</div>
          <div class="item">Item 11</div>
          <div class="item">Item 12</div>
        </div>
      </div>
    </div>
    <pre id="hud"></pre>
    <div id="spin-c"></div>
    <div id="spin-j"></div>
    <!--SCRIPT-->
  </body>
</html>
