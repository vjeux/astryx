<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sheet host spike</title>
    <style>
      :root {
        color-scheme: light;
        --sheet: #0a4bff;
        --dim-max: 0.35;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        timeline-scope: --sheet;
      }
      body {
        font:
          15px -apple-system,
          system-ui,
          sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #page {
        padding: 72px 16px 32px;
      }
      #page h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      #page .row {
        height: 52px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #d1d1d6;
      }
      #reopen {
        font: inherit;
        padding: 10px 16px;
        border-radius: 10px;
        border: 0;
        background: #1c1c1e;
        color: #fff;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        touch-action: none;
      }
      #dim.closed {
        pointer-events: none;
      }
      #dim.sd {
        animation-name: dimByScroll;
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --sheet;
      }
      @keyframes dimByScroll {
        from {
          opacity: 0;
        }
        to {
          opacity: var(--dim-max);
        }
      }
      #host {
        position: fixed;
        inset: 0;
      }
      #host.hybrid {
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        scroll-timeline: --sheet y;
      }
      #host.hybrid::-webkit-scrollbar {
        display: none;
      }
      #host.passthrough,
      #host.js {
        pointer-events: none;
      }
      #host.js {
        overflow: hidden;
      }
      #host.js #spacer {
        display: none;
      }
      #sheet {
        position: relative;
        pointer-events: auto;
        background: var(--sheet);
        color: #fff;
        border-radius: 12px 12px 0 0;
        /* Paints below the sheet when it rubber-bands up; not scroll overflow. */
        box-shadow: 0 600px 0 0 var(--sheet);
      }
      #host.js #sheet {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        touch-action: none;
        will-change: transform;
      }
      #grabber {
        position: absolute;
        top: 6px;
        left: 50%;
        width: 36px;
        height: 5px;
        margin-left: -18px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.85);
      }
      #sheet .content {
        padding: 28px 0 0 20px;
        width: 62%;
      }
      #sheet .item {
        height: 52px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      }
      .snap {
        position: absolute;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
        scroll-snap-align: start;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 8px;
        max-width: 58vw;
        margin: 0;
        padding: 4px 6px;
        font:
          10px/1.3 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
      }
      #spin-c,
      #spin-j {
        position: fixed;
        top: 12px;
        width: 20px;
        height: 20px;
        border-radius: 3px;
        pointer-events: none;
        z-index: 10;
      }
      #spin-c {
        right: 8px;
        background: #19c37d;
        animation: spin 1s linear infinite;
      }
      #spin-j {
        right: 36px;
        background: #ff3b30;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <h1>Page behind the sheet</h1>
      <p><button id="reopen" type="button" hidden>Open sheet</button></p>
      <div class="row">Row 1</div>
      <div class="row">Row 2</div>
      <div class="row">Row 3</div>
      <div class="row">Row 4</div>
      <div class="row">Row 5</div>
      <div class="row">Row 6</div>
      <div class="row">Row 7</div>
      <div class="row">Row 8</div>
      <div class="row">Row 9</div>
      <div class="row">Row 10</div>
      <div class="row">Row 11</div>
      <div class="row">Row 12</div>
    </main>
    <div id="dim"></div>
    <div id="host">
      <div id="spacer"></div>
      <div id="sheet" role="dialog" aria-label="Spike sheet">
        <div id="grabber"></div>
        <div class="content">
          <div class="item">Item 1</div>
          <div class="item">Item 2</div>
          <div class="item">Item 3</div>
          <div class="item">Item 4</div>
          <div class="item">Item 5</div>
          <div class="item">Item 6</div>
          <div class="item">Item 7</div>
          <div class="item">Item 8</div>
          <div class="item">Item 9</div>
          <div class="item">Item 10</div>
          <div class="item">Item 11</div>
          <div class="item">Item 12</div>
        </div>
      </div>
    </div>
    <pre id="hud"></pre>
    <div id="spin-c"></div>
    <div id="spin-j"></div>
    <script>
"use strict";
(() => {
  // internal/spikes/c17-sheet-host/src/geometry.ts
  function measureGeometry(host2) {
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;pointer-events:none;height:calc(env(safe-area-inset-top, 0px) + 10px)";
    document.body.appendChild(probe);
    const safeTopPlus10 = probe.getBoundingClientRect().height;
    probe.remove();
    const W = host2.clientWidth;
    const H = host2.clientHeight;
    const largeTop = Math.max(40, Math.round(safeTopPlus10));
    const sMedium = Math.round(H / 2);
    const sLarge = H - largeTop;
    return {
      W,
      H,
      largeTop,
      sMedium,
      sLarge,
      detents: [0, sMedium, sLarge],
      dimMax: 0.35
    };
  }
  function dimFor(g2, s) {
    return g2.dimMax * Math.min(1, Math.max(0, s / g2.sMedium));
  }
  function nearestDetent(g2, s) {
    let best = g2.detents[0];
    for (const d of g2.detents) {
      if (Math.abs(d - s) < Math.abs(best - s)) {
        best = d;
      }
    }
    return best;
  }
  function publishGeometry(g2, currentS) {
    const describe = () => {
      const top = g2.H - currentS();
      return {
        viewport: { w: g2.W, h: g2.H },
        detents: { closed: 0, medium: g2.sMedium, large: g2.sLarge },
        sheetTop: { medium: g2.H - g2.sMedium, large: g2.H - g2.sLarge, now: top },
        /** Handle (grabber) centre, page coordinates. */
        handle: [Math.round(g2.W / 2), Math.round(top + 8)],
        /** A point on the sheet body just under the handle. */
        grab: [Math.round(g2.W / 2), Math.round(top + 40)],
        /** A point deep in the sheet body: on the sheet at both medium and large. */
        body: [Math.round(g2.W / 2), Math.round(g2.H - g2.sMedium + 150)],
        /** Column the sheet's top edge is scanned in (no handle, text or HUD there). */
        scan: { x: Math.round(g2.W * 0.75) },
        sheetColor: "#0a4bff"
      };
    };
    Object.defineProperty(window, "__geometry", {
      configurable: true,
      enumerable: true,
      get: describe
    });
  }

  // packages/core/src/motion/uikit/scroll.ts
  var scroll = {
    decelerationRate: {
      /**
       * Normal deceleration: the release velocity is multiplied by this every
       * millisecond. The value of the public SDK constant
       * `UIScrollView.DecelerationRate.normal`; its per-millisecond meaning is
       * the one WWDC18 803's projection function assumes ((v ÷ 1000) · r ÷
       * (1 − r)).
       * @source GUESS — SDK constant value as published in M. Neuburg,
       *   "Programming iOS", ch. 20 (UIScrollViewDecelerationRateNormal 0.998);
       *   Apple's page documents the constant, not its number:
       *   https://developer.apple.com/documentation/uikit/uiscrollview/decelerationrate-swift.struct/normal
       * @measure M-S1
       */
      normal: 0.998,
      /**
       * Fast deceleration (`UIScrollView.DecelerationRate.fast`).
       * @source GUESS — SDK constant value as published in M. Neuburg,
       *   "Programming iOS", ch. 20 (UIScrollViewDecelerationRateFast 0.99):
       *   https://developer.apple.com/documentation/uikit/uiscrollview/decelerationrate-swift.struct/fast
       * @measure M-S1
       */
      fast: 0.99
    },
    rubberBand: {
      /**
       * c in b = (1 − 1 ÷ (x·c ÷ d + 1))·d, d = the scroll view's size on the
       * axis (rubberBand.ts).
       * @source GUESS — formula and constant from Grant Paul,
       *   twitter.com/chpwn/status/285540192096497664; reproduced within 0.5 pt
       *   by I. Lobanov's device measurement of UIScrollView (finger 500 / 1000
       *   / 1500 pt past the edge → 205 / 328 / 409 pt on an 812 pt view),
       *   medium.com/@esskeetit/how-uiscrollview-works-e418adc47060
       * @measure M-S5
       */
      coefficient: 0.55
    },
    /**
     * The spring that returns content released past an edge, and that catches
     * a coast hitting an edge (its velocity handed to the spring).
     * @source GUESS — critically damped as in I. Lobanov's UIScrollView
     *   reimplementation (no oscillation at the bound); pace from SwiftUI's
     *   `.smooth` default duration until measured
     * @measure M-S3
     */
    bounce: { duration: 0.5, bounce: 0 },
    paging: {
      /**
       * Deceleration rate a paging release is projected with to pick the next
       * page (projection.ts `selectPage`).
       * @source GUESS — UIScrollView paging behaves like a fast scroll view;
       *   the rate it uses internally is not documented
       * @measure M-PG1
       */
      projectionRate: 0.99,
      /**
       * The spring that carries a paging scroll view onto its page.
       * @source GUESS — SwiftUI `.smooth` default until measured
       * @measure M-PG1
       */
      snap: { duration: 0.5, bounce: 0 }
    },
    /**
     * `delaysContentTouches`: how long a scroll view holds a touch-down from
     * its content while it decides whether the touch is a scroll (no highlight
     * flash on a quick scroll), in ms.
     * @source wwdc 2014-235 "Advanced Scrollviews and Touch Handling
     *   Techniques": the touch-delay recognizer UIScrollView uses runs "a
     *   pretty short timer … Let's say .15 seconds" (presenter's example value)
     * @source measured: Settings and Contacts, iOS 26.2, simulator driven with
     *   real HID touches at 60 fps, recorded with the touch press model
     *   (PRESS_ONSET_MS in packages/core/src/utils/pressGesture.ts, 2026-10-06)
     */
    delaysContentTouchesMs: 150
  };

  // packages/core/src/motion/projection.ts
  function projectDistance(velocity, rate = scroll.decelerationRate.normal) {
    if (!(rate > 0 && rate < 1)) {
      throw new RangeError(`projection: rate must be in (0, 1), got ${rate}`);
    }
    return velocity / 1e3 * rate / (1 - rate);
  }
  function project(position, velocity, rate = scroll.decelerationRate.normal) {
    return position + projectDistance(velocity, rate);
  }
  function selectSnapPoint(points, {
    position,
    velocity,
    rate = scroll.decelerationRate.normal,
    fromIndex,
    maxSteps
  }) {
    if (points.length === 0) {
      throw new RangeError(
        "projection: selectSnapPoint needs at least one point"
      );
    }
    const projected = project(position, velocity, rate);
    let lo = 0;
    let hi = points.length - 1;
    if (fromIndex != null && maxSteps != null) {
      lo = Math.max(lo, fromIndex - maxSteps);
      hi = Math.min(hi, fromIndex + maxSteps);
    }
    let best = lo;
    let bestDistance = Infinity;
    for (let i = lo; i <= hi; i++) {
      const distance = Math.abs(points[i] - projected);
      const isTie = Math.abs(distance - bestDistance) < 1e-9;
      const isAhead = Math.sign(points[i] - points[best]) === Math.sign(velocity);
      if (distance < bestDistance - 1e-9 || isTie && isAhead) {
        best = i;
        bestDistance = distance;
      }
    }
    return { index: best, value: points[best], projected };
  }

  // packages/core/src/motion/decay.ts
  function decayConstant(rate) {
    if (!(rate > 0 && rate < 1)) {
      throw new RangeError(`decay: rate must be in (0, 1), got ${rate}`);
    }
    return -1e3 * Math.log(rate);
  }
  function solveDecay({
    from,
    velocity: initialVelocity,
    rate = scroll.decelerationRate.normal
  }) {
    const lambda = decayConstant(rate);
    const rest = from + initialVelocity / lambda;
    const speed0 = Math.abs(initialVelocity);
    return {
      from,
      initialVelocity,
      rate,
      rest,
      value: (t) => from + initialVelocity * -Math.expm1(-lambda * t) / lambda,
      velocity: (t) => initialVelocity * Math.exp(-lambda * t),
      settleTime: (threshold) => {
        const remaining = speed0 / lambda;
        if (!(threshold > 0)) {
          return Infinity;
        }
        return remaining <= threshold ? 0 : Math.log(remaining / threshold) / lambda;
      },
      timeToSpeed: (speed) => speed0 <= speed ? 0 : speed > 0 ? Math.log(speed0 / speed) / lambda : Infinity,
      timeToReach: (target) => {
        if (initialVelocity === 0) {
          return target === from ? 0 : null;
        }
        const fraction = lambda * (target - from) / initialVelocity;
        if (fraction < 0 || fraction >= 1) {
          return null;
        }
        return -Math.log1p(-fraction) / lambda;
      }
    };
  }

  // packages/core/src/motion/uikit/springs.ts
  var UIKIT_DEFAULT_SPRING = { mass: 3, stiffness: 1e3, damping: 500 };
  var springs = {
    // ---------------------------------------------------------------------
    // Sourced presets
    // ---------------------------------------------------------------------
    /**
     * SwiftUI `.smooth`: no bounce. Also SwiftUI's `Spring()` and
     * `.spring(duration:bounce:)` defaults.
     * @source apple-docs https://developer.apple.com/documentation/swiftui/spring/smooth(duration:extrabounce:)
     */
    smooth: { duration: 0.5, bounce: 0 },
    /**
     * SwiftUI `.snappy`: "small amount of bounce", base bounce 0.15.
     * @source apple-docs https://developer.apple.com/documentation/swiftui/spring/snappy(duration:extrabounce:)
     */
    snappy: { duration: 0.5, bounce: 0.15 },
    /**
     * SwiftUI `.bouncy`: base bounce 0.3.
     * @source apple-docs https://developer.apple.com/documentation/swiftui/spring/bouncy(duration:extrabounce:)
     */
    bouncy: { duration: 0.5, bounce: 0.3 },
    /**
     * SwiftUI `interactiveSpring()` defaults: for a value that tracks a finger.
     * @source apple-docs https://developer.apple.com/documentation/swiftui/animation/interactivespring(response:dampingfraction:blendduration:)
     */
    interactive: { response: 0.15, dampingRatio: 0.86 },
    /**
     * SwiftUI `Animation.default` since iOS 17 (what `withAnimation` uses).
     * @source apple-docs https://developer.apple.com/documentation/swiftui/animation/default
     */
    swiftUIDefault: { response: 0.55, dampingRatio: 1 },
    /**
     * SwiftUI `.spring(response:dampingFraction:blendDuration:)` defaults.
     * @source apple-docs https://developer.apple.com/documentation/swiftui/animation/spring(response:dampingfraction:blendduration:)
     */
    swiftUISpring: { response: 0.5, dampingRatio: 0.825 },
    /**
     * UIKit `UIView.animate(springDuration:bounce:…)` defaults (iOS 17).
     * @source apple-docs https://developer.apple.com/documentation/uikit/uiview/animate(springduration:bounce:initialspringvelocity:delay:options:animations:completion:)
     */
    uikitSpringDuration: { duration: 0.5, bounce: 0 },
    /**
     * UIKit's default spring, `UISpringTimingParameters()`: Apple documents
     * its damping ratio as 4.56, which is exactly 500 ÷ (2·√(3·1000)).
     * Overdamped on paper; Core Animation treats overdamping as critical
     * unless told otherwise, which `toSpring` mirrors: in effect a critically
     * damped spring with ω₀ = 18.26 rad/s (response 0.344 s) that settles in
     * 0.506 s. It is also the curve behind the keyboard's undocumented
     * animation curve 7.
     * @source apple-docs https://developer.apple.com/documentation/uikit/uispringtimingparameters/init() (damping ratio 4.56)
     * @source GUESS — the mass 3 / stiffness 1000 / damping 500 triple is
     *   community reverse engineering consistent with that ratio; whether
     *   overdamping is honored is not documented
     * @measure M-K2
     * @measure M-CA1
     */
    uikitDefault: UIKIT_DEFAULT_SPRING,
    // ---------------------------------------------------------------------
    // Navigation (UINavigationController)
    // ---------------------------------------------------------------------
    /**
     * Push: incoming view slides in from the trailing edge, outgoing parallax.
     * @source GUESS — UIKit's default spring (system-driven transition)
     * @measure M-N1
     */
    navigationPush: UIKIT_DEFAULT_SPRING,
    /**
     * Pop (back button).
     * @source GUESS — UIKit's default spring (system-driven transition)
     * @measure M-N2
     */
    navigationPop: UIKIT_DEFAULT_SPRING,
    /**
     * Interactive pop (edge swipe) finishing or cancelling after the finger
     * lifts; the release velocity is handed to it.
     * @source GUESS — UIKit's default spring
     * @measure M-N3
     */
    navigationInteractivePopFinish: UIKIT_DEFAULT_SPRING,
    // ---------------------------------------------------------------------
    // Sheets (UISheetPresentationController)
    // ---------------------------------------------------------------------
    /**
     * Sheet presented by a tap: no overshoot.
     * @source wwdc 2018-803 "Designing Fluid Interfaces": a presentation
     *   driven by a tap has no momentum, so Music's Now Playing uses 100 %
     *   damping (damping ratio)
     * @source GUESS — pace from UIKit's default spring
     * @measure M-SH1
     */
    sheetPresent: UIKIT_DEFAULT_SPRING,
    /**
     * Sheet dismissed by a control (Cancel / Done / scrim tap).
     * @source wwdc 2018-803 (no momentum → 100 % damping)
     * @source GUESS — pace from UIKit's default spring
     * @measure M-SH2
     */
    sheetDismiss: UIKIT_DEFAULT_SPRING,
    /**
     * Sheet dismissed by a swipe: the gesture's momentum earns a little
     * overshoot.
     * @source wwdc 2018-803 "Designing Fluid Interfaces": swipe-to-dismiss

     * @source GUESS — response from UIKit's default spring's ω₀
     * @measure M-SH2
     */
    sheetDismissSwipe: { response: 0.344, dampingRatio: 0.8 },
    /**
     * Snap between detents after a drag releases (release velocity handed
     * over).
     * @source GUESS — critically damped at UIKit's default pace
     * @measure M-SH3
     */
    sheetDetent: UIKIT_DEFAULT_SPRING,
    // ---------------------------------------------------------------------
    // Alerts, action sheets, menus
    // ---------------------------------------------------------------------
    /**
     * Alert (UIAlertController .alert) appearing.
     * @source GUESS — UIKit's default spring
     * @measure M-A1
     */
    alertPresent: UIKIT_DEFAULT_SPRING,
    /**
     * Alert dismissing.
     * @source GUESS — UIKit's default spring
     * @measure M-A1
     */
    alertDismiss: UIKIT_DEFAULT_SPRING,
    /**
     * Action sheet (UIAlertController .actionSheet) appearing.
     * @source GUESS — UIKit's default spring
     * @measure M-AS1
     */
    actionSheetPresent: UIKIT_DEFAULT_SPRING,
    /**
     * Action sheet dismissing.
     * @source GUESS — UIKit's default spring
     * @measure M-AS1
     */
    actionSheetDismiss: UIKIT_DEFAULT_SPRING,
    /**
     * UIMenu (pull-down / button menu) opening.
     * @source GUESS — UIKit's default spring
     * @measure M-AS1
     */
    menuOpen: UIKIT_DEFAULT_SPRING,
    /**
     * UIMenu closing.
     * @source GUESS — UIKit's default spring
     * @measure M-AS1
     */
    menuClose: UIKIT_DEFAULT_SPRING,
    /**
     * Context menu (UIContextMenuInteraction): preview lift after the long
     * press commits.
     * @source GUESS — UIKit's default spring
     * @measure M-CM1
     */
    contextMenuLift: UIKIT_DEFAULT_SPRING,
    /**
     * Context menu dismissing back into its source.
     * @source GUESS — UIKit's default spring
     * @measure M-CM1
     */
    contextMenuDismiss: UIKIT_DEFAULT_SPRING,
    // ---------------------------------------------------------------------
    // Controls
    // ---------------------------------------------------------------------
    /**
     * UISwitch thumb travelling between off and on.
     * @source webkit Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm
     *   `thumbMoveSpring = SpringSolver(1.0, 438.649…, 31.4159…)`, "Values
     *   chosen for consistency with UIKit" (= response 0.30 s, ratio 0.75);
     *   its settling duration is WebKit's iOS switch duration 0.48801 s
     *   (RenderThemeIOS.h)
     * @measure M-SW1
     */
    switchThumbMove: { response: 0.3, dampingRatio: 0.75 },
    /**
     * UISwitch thumb stretching while pressed and relaxing on release.
     * @source webkit Source/WebCore/rendering/cocoa/RenderThemeCocoa.mm
     *   `thumbPressSpring = SpringSolver(1.0, 322.272…, 31.2364…)`, "Values
     *   chosen for consistency with UIKit" (= response 0.35 s, ratio 0.87);
     *   settles in WebKit's held duration 0.50740 s (RenderThemeIOS.h)
     * @measure M-SW1
     */
    switchThumbStretch: { response: 0.35, dampingRatio: 0.87 },
    /**
     * UISegmentedControl selection thumb sliding to a new segment.
     * @source GUESS — WebKit's UIKit-matched switch thumb spring, the nearest
     *   sourced control thumb
     * @measure M-SG1
     */
    segmentedThumb: { response: 0.3, dampingRatio: 0.75 },
    // ---------------------------------------------------------------------
    // System
    // ---------------------------------------------------------------------
    /**
     * Keyboard frame animation (UIKeyboardAnimationCurveUserInfoKey = 7).
     * @source GUESS — UIKit's default spring (community reverse engineering)
     * @measure M-K2
     */
    keyboard: UIKIT_DEFAULT_SPRING,
    /**
     * Scroll-to-top after a status-bar tap.
     * @source GUESS — UIKit's default spring
     * @measure M-ST1
     */
    scrollToTop: UIKIT_DEFAULT_SPRING,
    /**
     * Banner / toast sliding in from the top edge (system notification
     * banner as the reference).
     * @source GUESS — UIKit's default spring
     * @measure M-T1
     */
    banner: UIKIT_DEFAULT_SPRING
  };

  // internal/spikes/c17-sheet-host/src/host.ts
  var round2 = (n) => Math.round(n * 100) / 100;

  // packages/core/src/motion/spring.ts
  var TAU = 2 * Math.PI;
  function assertPositiveFinite(name, value) {
    if (!(Number.isFinite(value) && value > 0)) {
      throw new RangeError(
        `spring: ${name} must be a positive number, got ${value}`
      );
    }

    duration,
    bounce
  }) {
    assertPositiveFinite("duration", duration);
    if (!Number.isFinite(bounce)) {
      throw new RangeError(`spring: bounce must be finite, got ${bounce}`);
    }

        yieldMs: n[1] || 16,
        delay: n[2] || 1500,
        stopAfter: n[3] || 12e3
      };
    }
    if (kind === "window") {
      return { kind, delay: n[0] || 3e3, block: n[1] || 1500 };
    }
    if (kind === "ontouch") {
      return { kind, delay: n[0] ?? 50, block: n[1] || 3e3 };
    }
    throw new Error(`busy: unknown kind ${raw}`);
  }
  function parseSpring(raw) {
    if (raw == null || raw === "") {
      return null;
    }
    const num = (key) => {
      const match = new RegExp(`${key}(-?[0-9.]+)`).exec(raw);
      return match ? Number(match[1]) : void 0;
    };
    const r = num("r");
    const z = num("z");
    if (r != null && z != null) {
      return { response: r, dampingRatio: z };
    }
    const d = num("d");
    const b = num("b");
    if (d != null && b != null) {
      return { duration: d, bounce: b };
    }
    const k = num("k");
    const c = num("c");
    if (k != null && c != null) {
      return { mass: num("m") ?? 1, stiffness: k, damping: c };
    }
    throw new Error(`spring: cannot parse ${raw}`);
  }
  function parseParams(search) {
    const q = new URLSearchParams(search);
    const pick = (key, values, fallback) => {
      const v = q.get(key);
      return values.includes(v ?? "") ? v : fallback;
    };
    return {
      mode: pick("mode", ["hybrid", "js"], "hybrid"),
      release: pick("release", ["spring", "native"], "spring"),
      handoff: pick("handoff", ["read", "extrap"], "extrap"),
      busy: parseBusy(q.get("busy")),
      open: pick("open", ["closed", "medium", "large"], "medium"),
      spring: parseSpring(q.get("spring")),
      stop: pick("stop", ["assign", "instant"], "assign"),
      snapDuringTouch: q.get("snaptouch") !== "0",
      lateMs: Number(q.get("latems") ?? 40) || 40,
      passthrough: q.get("passthrough") !== "0",
      dim: pick("dim", ["scroll", "js"], "scroll"),
      jsDim: q.get("jsdim") !== "0",
      hud: q.get("hud") !== "0",
      label: q.get("label") ?? ""
    };
  }

  // internal/spikes/c17-sheet-host/src/busy.ts
  function block(ms, tracer2, reason) {
    const start = performance.now();
    tracer2.log("busy-start", { ms, reason });
    while (performance.now() - start < ms) {
    }
    tracer2.log("busy-end", { ms, reason, actual: performance.now() - start });
  }
  function startBusy(spec, tracer2) {
    if (spec.kind === "always") {
      const startedAt = performance.now() + spec.delay;
      const loop = () => {
        if (performance.now() - startedAt > spec.stopAfter) {
          tracer2.log("busy-stopped");
          return;
        }
        block(spec.block, tracer2, "always");
        setTimeout(loop, spec.yieldMs);
      };
      setTimeout(loop, spec.delay);
    } else if (spec.kind === "window") {
      setTimeout(() => block(spec.block, tracer2, "window"), spec.delay);
    } else if (spec.kind === "ontouch") {
      let pending = 0;
      return () => {
        if (pending !== 0) {
          return;
        }
        pending = window.setTimeout(() => {
          block(spec.block, tracer2, "ontouch");
          pending = 0;
        }, spec.delay);
      };
    }
    return () => {
    };
  }

  // internal/spikes/c17-sheet-host/src/trace.ts
  var r1 = (n) => Math.round(n * 10) / 10;
  function createTracer(meta) {
    const trace = {
      meta,
      timeOrigin: performance.timeOrigin,
      events: [],
      scroll: [],
      moves: []
    };
    window.__trace = trace;
    return {
      trace,
      log(type, data = {}) {
        trace.events.push({ t: r1(performance.now()), type, ...data });
      },
      scroll(timeStamp, s) {
        trace.scroll.push([r1(timeStamp), r1(s)]);
      },
      move(timeStamp, y) {
        trace.moves.push([r1(timeStamp), r1(y), r1(performance.now())]);
      }
    };
  }

  // internal/spikes/c17-sheet-host/src/main.ts
  var p = parseParams(location.search);
  var $ = (id) => document.getElementById(id);
  var host = $("host");
  var spacer = $("spacer");
  var sheet = $("sheet");
  var dim = $("dim");
  var hud = $("hud");
  var reopen = $("reopen");
  var spinJ = $("spin-j");
  var tracer = createTracer({
    params: p,
    userAgent: navigator.userAgent,
    loadedAt: performance.now(),
    devicePixelRatio: window.devicePixelRatio
  });
  var g = measureGeometry(host);
  tracer.trace.meta.geometry = g;
  var heartbeat = { last: performance.now() };
  var frame = (now) => {
    heartbeat.last = now;
    spinJ.style.transform = `rotate(${now / 1e3 % 1 * 360}deg)`;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  var onTouchStart = startBusy(p.busy, tracer);
  var initialS = p.open === "large" ? g.sLarge : p.open === "medium" ? g.sMedium : 0;
  var ctx = {
    host,
    spacer,
    sheet,
    dim,
    g,
    p,
    tracer,
    heartbeat,
    onTouchStart,
    initialS,
    onClosed: () => {
      dim.classList.add("closed");
      reopen.hidden = false;
    }
  };
  var api = p.mode === "js" ? mountJs(ctx) : mountHybrid(ctx);
  if (initialS === 0) {
    ctx.onClosed();
  }
  publishGeometry(g, () => api.currentS());
  reopen.addEventListener("click", () => {
    dim.classList.remove("closed");
    reopen.hidden = true;
    api.present(g.sMedium);
  });
  dim.addEventListener("click", () => {
    if (!dim.classList.contains("closed")) {
      api.dismiss();
    }
  });
  if (p.hud) {
    const label = [
      p.label,
      p.mode,
      p.mode === "hybrid" ? `${p.release}/${p.handoff}` : ""
    ].filter(Boolean).join(" ");
    const busy = p.busy.kind === "none" ? "idle" : `${p.busy.kind}:${"block" in p.busy ? p.busy.block : ""}`;
    setInterval(() => {
      const st = api.state();
      const last = [...tracer.trace.events].reverse().find((e) => e.type === "release" || e.type === "pointerup");
      hud.textContent = `${label} | ${busy}
S ${Math.round(Number(st.s))} rest ${String(st.restingAt ?? "")}` + (last ? ` | v ${Math.round(Number(last.velocity))} \u2192 ${String(last.target)}` : "");
    }, 200);
  } else {
    hud.hidden = true;
  }
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      tracer.log("ready", { state: api.state() });
      window.__ready = true;
    });
  });
})();
</script>
